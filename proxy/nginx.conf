# JSON access log: request line parts, status and timings only. No headers, cookies or query strings.
log_format epicbook_json escape=json
  '{"time":"$time_iso8601","client":"$remote_addr","method":"$request_method",'
  '"path":"$uri","status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,'
  '"upstream":"$upstream_addr","upstream_status":"$upstream_status","upstream_time":"$upstream_response_time"}';

server {
  listen 80;
  server_name _;

  access_log /var/log/nginx/epicbook-access.log epicbook_json;
  error_log  /var/log/nginx/epicbook-error.log warn;

  # Resolve service names through Docker's DNS at request time, so a restarted
  # container with a new IP is picked up without reloading Nginx.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend  http://backend:8080;
  set $frontend http://frontend:80;

  proxy_connect_timeout 5s;
  proxy_read_timeout    30s;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # Proxy's own liveness check (used by its Docker health check)
  location = /proxy-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Application health endpoint (backend + database)
  location = /health {
    proxy_pass $backend;
  }

  # API requests
  location /api/ {
    proxy_pass $backend;
  }

  # Static frontend assets (CSS, JS, images)
  location /assets/ {
    proxy_pass $frontend;
  }

  # Application pages (server-rendered by the backend)
  location / {
    proxy_pass $backend;
  }
}
